name: Build ASTRA OFFICE APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android --org com.astra.office --project-name astra_office
      - run: rm -rf test
      - name: Force Android compileSdk 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          grep -n "compileSdk" android/app/build.gradle.kts
      - run: flutter pub get
      - run: flutter analyze
      - run: if [ -d test ]; then flutter test; else echo 'No tests yet - skipping'; fi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ASTRA-OFFICE-ANDROID-APK
          path: build/app/outputs/flutter-apk/app-release.apk
