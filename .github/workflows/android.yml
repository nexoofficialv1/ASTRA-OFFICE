name: Build ASTRA OFFICE APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android --org com.astra.office --project-name astra_office
      - name: Apply ASTRA OFFICE branding
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp tooling/astra_office_icon.xml android/app/src/main/res/drawable/astra_office_icon.xml
          sed -i 's#android:label="astra_office"#android:label="ASTRA OFFICE"#g' android/app/src/main/AndroidManifest.xml
          sed -i 's#@mipmap/ic_launcher_round#@drawable/astra_office_icon#g' android/app/src/main/AndroidManifest.xml
          sed -i 's#@mipmap/ic_launcher#@drawable/astra_office_icon#g' android/app/src/main/AndroidManifest.xml
          grep -nE 'android:(label|icon|roundIcon)' android/app/src/main/AndroidManifest.xml
      - run: rm -rf test
      - name: Force Android compileSdk 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          grep -n "compileSdk" android/app/build.gradle.kts
      - run: flutter pub get
      - run: flutter analyze
      - run: if [ -d test ]; then flutter test; else echo 'No tests yet - skipping'; fi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ASTRA-OFFICE-ANDROID-APK
          path: build/app/outputs/flutter-apk/app-release.apk
